# Nombre de la aplicación
spring.application.name=safeexit-backend

# Puerto asignado por el proveedor de despliegue o 8081 en local
server.port=${PORT:8081}

# Conexión PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeexit_db}
spring.datasource.username=${DB_USER:safeexit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Seguridad
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
safeexit.security.camera-key=${CAMERA_API_KEY:}
safeexit.security.cors.allowed-origins=${SAFEEXIT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
safeexit.bootstrap.admin-email=${SAFEEXIT_ADMIN_EMAIL:}
safeexit.bootstrap.admin-password=${SAFEEXIT_ADMIN_PASSWORD:}
safeexit.bootstrap.admin-phone=${SAFEEXIT_ADMIN_PHONE:}

# Configuración del proyecto
safeexit.residential.name=${RESIDENTIAL_NAME:SafeExit}
safeexit.residential.address=${RESIDENTIAL_ADDRESS:Dirección por configurar}
safeexit.residential.nit=${RESIDENTIAL_NIT:DEMO-0001}
safeexit.alerts.default-advance-days=${ALERT_ADVANCE_DAYS:5}
safeexit.notifications.alert-template=${SAFEEXIT_ALERT_TEMPLATE:SafeExit: alerta {nivel} para vehículo {placa}. Documentos: {motivos}. Verifique antes de salir.}
safeexit.integrations.whatsapp-mode=${SAFEEXIT_WHATSAPP_MODE:${SAFEEXIT_INTEGRATIONS_MODE:mock}}
safeexit.integrations.plate-recognizer.mode=${SAFEEXIT_PLATE_OCR_MODE:${SAFEEXIT_INTEGRATIONS_MODE:mock}}
safeexit.integrations.documents-mode=${SAFEEXIT_DOCUMENTS_MODE:mock}
safeexit.integrations.plate-recognizer.token=${PLATE_RECOGNIZER_TOKEN:}
safeexit.integrations.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
safeexit.integrations.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
safeexit.integrations.twilio.sender=${TWILIO_WHATSAPP_SENDER:}
safeexit.integrations.twilio.public-url=${SAFEEXIT_PUBLIC_URL:}
safeexit.mock.plate=${MOCK_PLATE:ABC123}
safeexit.cache.enabled=${SAFEEXIT_CACHE_ENABLED:true}

# Límites de carga de imágenes de cámaras
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Health check para despliegue
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true