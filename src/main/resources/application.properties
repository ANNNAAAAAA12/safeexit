# Nombre de la aplicación
spring.application.name=safeexit-backend

# Puerto de la API REST (Cambiado a 8081 para evitar choques)
server.port=8081

# Conexión a PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/safeexit_db
spring.datasource.username=safeexit_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Secreto JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000