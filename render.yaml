services:
  - type: web
    name: safeexit-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CAMERA_API_KEY
        generateValue: true
      - key: SAFEEXIT_ADMIN_EMAIL
        sync: false
      - key: SAFEEXIT_ADMIN_PASSWORD
        sync: false
      - key: SAFEEXIT_ADMIN_PHONE
        sync: false
      - key: SAFEEXIT_CORS_ALLOWED_ORIGINS
        value: https://safeexit-frontend.onrender.com
      - key: RESIDENTIAL_NAME
        sync: false
      - key: RESIDENTIAL_ADDRESS
        sync: false
      - key: RESIDENTIAL_NIT
        sync: false
      - key: SAFEEXIT_INTEGRATIONS_MODE
        value: mock
      - key: SAFEEXIT_CACHE_ENABLED
        value: "true"
  - type: web
    name: safeexit-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://safeexit-backend.onrender.com/api/v1
