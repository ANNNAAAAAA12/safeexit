services:
  postgres-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: safeexit_db
      POSTGRES_USER: safeexit_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el entorno antes de iniciar Docker Compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeexit_user -d safeexit_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  safeexit-api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:8081"
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/safeexit_db
      DB_USER: safeexit_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CAMERA_API_KEY: ${CAMERA_API_KEY:?Define CAMERA_API_KEY en .env}
      SAFEEXIT_ADMIN_EMAIL: ${SAFEEXIT_ADMIN_EMAIL:?Define SAFEEXIT_ADMIN_EMAIL en .env}
      SAFEEXIT_ADMIN_PASSWORD: ${SAFEEXIT_ADMIN_PASSWORD:?Define SAFEEXIT_ADMIN_PASSWORD en .env}
      SAFEEXIT_ADMIN_PHONE: ${SAFEEXIT_ADMIN_PHONE:?Define SAFEEXIT_ADMIN_PHONE en .env}
      SAFEEXIT_CORS_ALLOWED_ORIGINS: ${SAFEEXIT_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SAFEEXIT_WHATSAPP_MODE: ${SAFEEXIT_WHATSAPP_MODE:-${SAFEEXIT_INTEGRATIONS_MODE:-mock}}
      SAFEEXIT_PLATE_OCR_MODE: ${SAFEEXIT_PLATE_OCR_MODE:-${SAFEEXIT_INTEGRATIONS_MODE:-mock}}
      MOCK_PLATE: ${MOCK_PLATE:-ABC123}
      PLATE_RECOGNIZER_TOKEN: ${PLATE_RECOGNIZER_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_SENDER: ${TWILIO_WHATSAPP_SENDER:-}
      SAFEEXIT_PUBLIC_URL: ${SAFEEXIT_PUBLIC_URL:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
      SAFEEXIT_CACHE_ENABLED: ${SAFEEXIT_CACHE_ENABLED:-true}

  safeexit-frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      safeexit-api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data: