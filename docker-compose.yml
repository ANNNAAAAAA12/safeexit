version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: safeexit_postgres
    restart: always
    environment:
      POSTGRES_DB: safeexit_db
      POSTGRES_USER: safeexit_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el entorno antes de iniciar Docker Compose}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: